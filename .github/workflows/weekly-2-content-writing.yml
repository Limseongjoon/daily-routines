name: Weekly 2 Content Writing

on:
  schedule:
    - cron: '0 22 * * 0' # 매주 월요일 오전 7:00 KST
  workflow_dispatch:

jobs:
  create-neopress-content-task:
    runs-on: ubuntu-latest

    steps:
      - name: Create Weekly Neopress Content Writing Task
        run: |
          response=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: ${{ secrets.LINEAR_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation{issueCreate(input:{title:\"Weekly Neopress Content Writing — 2 Contents\",description:\"이번 주 Neopress 콘텐츠 2개를 기획하고 작성합니다.\",teamId:\"a396ad9b-a75b-47b1-9ebd-874b5655b879\",assigneeId:\"3d716c59-d1c7-419f-b9a9-63c21ff97c42\",stateId:\"05478fae-e5f6-47a3-8c70-806b970bf582\"}){success issue{identifier title url}}}"}')

          echo "$response"
          echo "$response" | grep -q '"success":true' || exit 1
