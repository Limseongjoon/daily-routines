name: SEO/GEO Daily Report

on:
  schedule:
    - cron: '0 23 * * *'  # KST 08:00 (UTC 23:00 전날)
  workflow_dispatch:       # 수동 실행 가능

permissions:
  contents: read

jobs:
  seo-geo-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Configure Codex (MCP + web search)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<EOF
          # 모델명은 실행 전 \`codex --help\` / 공식 문서로 현재 사용 가능한 값 확인할 것
          model = "gpt-5-codex"

          [tools]
          web_search = true

          [mcp_servers.slack]
          command = "npx"
          args = ["-y", "@modelcontextprotocol/server-slack"]

          [mcp_servers.slack.env]
          SLACK_BOT_TOKEN = "${SLACK_BOT_TOKEN}"
          SLACK_TEAM_ID = "${SLACK_TEAM_ID}"
          EOF

      - name: Run SEO/GEO Daily Report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec \
            --dangerously-bypass-approvals-and-sandbox \
            "$(cat .github/prompts/seo-geo-report.md)"
